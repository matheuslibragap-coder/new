<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teia da Cidade - Homem-Aranha Pixel</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0a0a12;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Courier New', monospace;
    overflow: hidden;
  }
  #gameWrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  canvas {
    background: #000;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    border: 4px solid #d62828;
    box-shadow: 0 0 24px rgba(214,40,40,0.5);
    max-width: 96vw;
    max-height: 90vh;
  }
  #hint {
    color: #8a8a9a;
    font-size: 12px;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
  <div id="gameWrap">
    <canvas id="game" width="960" height="540"></canvas>
    <div id="hint">Setas/WASD = mover · ESPAÇO = pular · SHIFT ou clique do mouse = teia</div>
  </div>
  <script src="script.js"></script>
</body>
</html>
